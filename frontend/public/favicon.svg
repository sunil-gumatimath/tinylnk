<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    .fav-t { stroke: #f8fafc; }
    .fav-l { stroke: #10b981; }
    .fav-dot { fill: #a3ff12; }
    @media (prefers-color-scheme: light) {
      .fav-t { stroke: #0f172a; }
      .fav-l { stroke: #059669; }
      .fav-dot { fill: #047857; }
    }
  </style>
  <!-- 'T' Monogram -->
  <path d="M5 10.5h12" class="fav-t" stroke-width="3" stroke-linecap="round"/>
  <path d="M11 10.5v12c0 2 1.5 3.5 3.5 3.5h2" class="fav-t" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 'L' Monogram Interlock -->
  <path d="M19 6v14c0 2.2 1.8 4 4 4h4" class="fav-l" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="27" cy="24" r="2" class="fav-dot"/>
</svg>
