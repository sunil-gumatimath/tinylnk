services:
  app:
    build:
      context: .
      args:
        # Inlined into the frontend bundle at build time — changing it requires
        # a rebuild (`docker compose up -d --build`).
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      - SQLITE_DB_PATH=/app/data/urlshortener.db
      - TINYLNK_CORS_ORIGINS=${TINYLNK_CORS_ORIGINS:-http://localhost:8000}
      - TINYLNK_REDIRECT_WARNING=${TINYLNK_REDIRECT_WARNING:-false}
      - TINYLNK_ENABLE_DOCS=${TINYLNK_ENABLE_DOCS:-false}
      # Backend JWT verification: issuer (or the publishable key it is derived
      # from). No secret key is used — keys come from Clerk's public JWKS.
      - CLERK_ISSUER=${CLERK_ISSUER:-}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
    networks:
      - tinylnk-network

networks:
  tinylnk-network:
    driver: bridge
