services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      - SQLITE_DB_PATH=/app/data/urlshortener.db
      - TINYLNK_ADMIN_KEY=${TINYLNK_ADMIN_KEY:-}
      - TINYLNK_CORS_ORIGINS=${TINYLNK_CORS_ORIGINS:-http://localhost:8000}
      - TINYLNK_REDIRECT_WARNING=${TINYLNK_REDIRECT_WARNING:-false}
      - TINYLNK_ENABLE_DOCS=${TINYLNK_ENABLE_DOCS:-false}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_ISSUER=${CLERK_ISSUER:-}
    networks:
      - tinylnk-network

networks:
  tinylnk-network:
    driver: bridge
