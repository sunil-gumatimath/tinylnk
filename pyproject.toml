[project]
name = "tinylnk"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "sqlalchemy==2.0.35",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv==1.0.1",
  "slowapi==0.1.9",
  "user-agents==2.2.0",
  "qrcode[pil]==7.4.2",
  "pydantic>=2.9,<3",
  "pyjwt[crypto]>=2.8,<3",
  "sentry-sdk>=2.0,<3.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "cd frontend && bun install --frozen-lockfile && bun run build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
# Keep CI to real problems: errors, bugs, imports, unused vars.
# Style families (UP/BLE/SIM/…) intentionally not enabled — enable deliberately later.
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E402", # module-level imports after load_dotenv() — intentional env-first bootstrap
    "B008", # function calls in defaults — FastAPI Depends()/Query() idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
